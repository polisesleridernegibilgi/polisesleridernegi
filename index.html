<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polis Eşleri Derneği</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ECDDCB;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('lace-bg.jpg');
      background-size: cover;
      background-repeat: repeat;
      color: #493840;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      text-align: center;
    }
    img.logo {
      max-width: 180px;
      margin-top: 40px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      margin: 0.5em 0 0.3em;
    }
    p {
      font-size: 1.2em;
      margin: 0.2em 0 0.8em;
      padding: 0 20px;
    }
    a.button {
      display: inline-block;
      background-color: #493840;
      color: #ECDDCB;
      padding: 0.8em 2em;
      margin: 0.5em;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a.button:hover {
      background-color: #7a6179;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Polis Eşleri Derneği Logosu" class="logo">
  <h1>Güvenlik için çalışan eller, yardım için kenetleniyor</h1>
  <p><strong>Polis Eşleri Derneği, 81 ilimizle iyilik hareketinde buluşuyor.<br>
  Bu büyük buluşmaya katılımınız bizleri onurlandıracaktır.</strong></p>
  <p>Bizi takip edin ve daha fazla bilgi edinin</p>
  <a class="button" href="https://instagram.com/polisesleridernegi" target="_blank">Instagram</a>
  <a class="button" href="https://polisesleridernegi.org.tr" target="_blank">Web Sitesi</a>
  <a class="button" href="https://maps.app.goo.gl/Jv6P6CC1UGtU6uiDA" target="_blank">Konum</a>
</body>
</html>
